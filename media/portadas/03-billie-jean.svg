<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"
  viewBox="0 0 300 300"
  role="img" aria-label="Portada de Billie Jean — Michael Jackson">
  <title>Billie Jean · Michael Jackson</title>
  <style>
    :root {
      --color-bg-deep: #020617;
      --color-bg-card: rgba(15, 23, 42, 0.72);
      --color-bg-card-hover: rgba(30, 41, 59, 0.8);
      --color-accent-indigo: #4f46e5;
      --color-accent-glow: #6366f1;
      --color-accent-muted: rgba(79, 70, 229, 0.15);
      --color-text-main: #f1f5f9;
      --color-text-muted: #94a3b8;
      --color-border-glass: rgba(148, 163, 184, 0.12);
      --color-border-glass-hover: rgba(148, 163, 184, 0.22);
    }
    text { font-family: "Geist Variable", "Inter Variable", system-ui, sans-serif; }
    .iniciales { font-size: 88px; font-weight: 800; letter-spacing: -0.04em;
                 fill: var(--color-text-main); }
    .artista { font-size: 12px; font-weight: 700; letter-spacing: 0.16em;
               fill: var(--color-text-muted); }

  </style>
  <defs>
    <linearGradient id="fondo-03-billie-jean" x1="0" y1="0" x2="0" y2="1"
      gradientTransform="rotate(45 .5 .5)">
      <stop offset="0" stop-color="var(--color-bg-deep)"/>
      <stop offset="1" stop-color="var(--color-bg-card-hover)"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" fill="url(#fondo-03-billie-jean)"/>
  <rect x="12" y="12" width="26" height="26" fill="var(--color-accent-indigo)" fill-opacity="0.30"/>
  <rect x="162" y="62" width="26" height="26" fill="var(--color-accent-indigo)" fill-opacity="0.45"/>
  <rect x="212" y="62" width="26" height="26" fill="var(--color-accent-indigo)" fill-opacity="0.60"/>
  <circle cx="275" cy="75" r="12" fill="var(--color-accent-glow)" fill-opacity="0.85"/>
  <rect x="12" y="112" width="26" height="26" fill="var(--color-accent-indigo)" fill-opacity="0.30"/>
  <circle cx="275" cy="125" r="12" fill="var(--color-accent-glow)" fill-opacity="0.85"/>
  <circle cx="25" cy="175" r="8" fill="var(--color-accent-glow)" fill-opacity="0.85"/>
  <circle cx="125" cy="175" r="12" fill="var(--color-accent-glow)" fill-opacity="0.85"/>
  <circle cx="225" cy="175" r="10" fill="var(--color-accent-glow)" fill-opacity="0.85"/>
  <rect x="112" y="212" width="26" height="26" fill="var(--color-accent-indigo)" fill-opacity="0.60"/>
  <circle cx="25" cy="275" r="8" fill="var(--color-accent-glow)" fill-opacity="0.85"/>
  <circle cx="75" cy="275" r="10" fill="var(--color-accent-glow)" fill-opacity="0.85"/>
  <circle cx="125" cy="275" r="12" fill="var(--color-accent-glow)" fill-opacity="0.85"/>
  <rect x="8" y="8" width="284" height="284" fill="none"
    stroke="var(--color-border-glass-hover)" stroke-opacity="0.5"/>
  <text class="iniciales" x="24" y="246">BJ</text>
  <text class="artista" x="26" y="274">Michael Jackson</text>
</svg>
